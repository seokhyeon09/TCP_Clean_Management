version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: tcp-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tcp_clean_db
      MYSQL_USER: tcp_user
      MYSQL_PASSWORD: tcp_password
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --character-set-client-handshake=FALSE --init_connect='SET NAMES utf8mb4'
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u tcp_user -p$$MYSQL_PASSWORD -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - tcp-network

  redis:
    image: redis:7-alpine
    container_name: tcp-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redispass
    volumes:
      - redis-data:/data
    networks:
      - tcp-network

  sensor-ai:
    build: ./ai-service
    container_name: tcp-sensor-ai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - tcp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tcp-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/tcp_clean_db?useSSL=false&serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=tcp_user
      - SPRING_DATASOURCE_PASSWORD=tcp_password
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=redispass
      - SENSOR_AI_URL=http://sensor-ai:8090
      - SENSOR_AI_ENABLED=${SENSOR_AI_ENABLED:-true}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      sensor-ai:
        condition: service_started
    networks:
      - tcp-network

  # [React 프론트엔드 컨테이너]
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tcp-frontend
    ports:
      - "3000:80" # Nginx가 내부적으로 80번 포트를 씁니다
    depends_on:
      - backend
    networks:
      - tcp-network

networks:
  tcp-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
